<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>项目协作 · 派森诺基因云平台</title>
  <link rel="stylesheet" href="styles.css?v=groups-20261022">
</head>
<body>
  <header class="global-header" aria-label="平台顶部导航">
    <div class="global-header-inner">
      <img src="顶部导航-参考截图.png" alt="派森诺基因云平台顶部导航：云分析、云图汇、云学院、问题反馈、签到、我的项目">
      <button class="global-analysis-link" data-global-analysis type="button" aria-label="返回云分析详情"></button>
      <button class="global-projects-link" data-global-projects type="button" aria-label="查看我的项目"></button>
    </div>
  </header>
  <div class="app-shell" data-screen-label="项目协作交互原型">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand"><div class="brand-symbol" aria-hidden="true"><span></span><span></span><span></span><span></span></div><div><strong>派森诺</strong><small>基因云平台</small></div></div>
      <div class="side-caption">WORKSPACE</div>
      <nav class="side-nav">
        <button class="nav-item" data-nav="overview"><span class="nav-icon" data-icon="grid"></span>项目概况</button>
        <button class="nav-item active" data-nav="projects"><span class="nav-icon" data-icon="layers"></span>项目列表<span class="nav-chevron">⌄</span></button>
        <div class="nav-nested"><button class="nav-sub" data-nav="projects">云分析</button><button class="nav-sub" data-nav="projects">云图汇</button></div>
        <button class="nav-item" data-nav="groups"><span class="nav-icon" data-icon="people"></span>课题组列表</button>
        <button class="nav-item" data-nav="members"><span class="nav-icon" data-icon="person"></span>成员列表</button>
        <button class="nav-item" data-nav="data"><span class="nav-icon" data-icon="folder"></span>项目数据</button>
      </nav>
      <div class="side-bottom"><div class="side-bottom-mark">协作空间 <span>PREVIEW</span></div><p>围绕项目，安全地共享数据与分析成果。</p></div>
    </aside>

    <div class="workspace">
      <header class="topbar"><div class="crumb" id="crumb">项目管理 <span>/</span> 项目列表</div><div class="header-actions"><span class="demo-badge">交互原型 · 示例数据</span><label class="identity-switch">体验身份 <select id="identitySelect" aria-label="切换体验身份"><option value="owner">项目所有者</option><option value="admin">管理员</option><option value="member">成员</option><option value="visitor">访问者</option></select></label><div class="user-avatar" aria-label="当前用户">王</div></div></header>
      <main id="main"></main>
    </div>
  </div>

  <div id="modalRoot" class="modal-root" hidden></div>
  <div id="confirmRoot" class="account-tip" role="status" aria-live="assertive" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js?v=groups-20261022"></script>
</body>
</html>
