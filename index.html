<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>项目协作 · 派森诺基因云平台</title>
  <meta name="description" content="派森诺科研协作空间：管理项目、课题组与成员，体验单项目和批量项目协作。">
  <meta name="theme-color" content="#1989fa">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231989fa'/%3E%3Cpath d='M22 17h12a10 10 0 0 1 0 20H22m0-20v31m0-20h12' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=20261029-roster-pending-six">
</head>
<body>
  <div class="app-shell" data-screen-label="项目协作交互原型">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#projects" aria-label="派森诺基因云平台首页"><span class="brand-symbol" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M9 7h8a7 7 0 0 1 0 14H9M9 7v20m0-13h8" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg></span><span><strong>派森诺<span class="brand-dot">.</span></strong><small>基因云平台</small></span></a>
      <div class="workspace-label"><span class="workspace-logo" data-icon="layers"></span><span>我的科研空间<small>项目与团队协作</small></span><span class="workspace-indicator"></span></div>
      <div class="side-caption">工作空间</div>
      <nav class="side-nav">
        <button class="nav-item" data-nav="overview"><span class="nav-icon" data-icon="grid"></span>项目概况</button>
        <div class="project-nav-group">
          <button class="nav-item project-menu-button" data-project-menu aria-expanded="true" aria-controls="projectSubnav"><span class="nav-icon" data-icon="folder"></span>项目列表<span class="nav-count" id="navProjectCount">8</span><span class="nav-menu-chevron" aria-hidden="true">⌃</span></button>
          <div class="nav-submenu" id="projectSubnav" aria-label="项目列表子目录">
            <button class="nav-item nav-sub-item" data-nav="visual"><span class="nav-sub-dot"></span>云图汇</button>
            <button class="nav-item nav-sub-item active" data-nav="projects"><span class="nav-sub-dot"></span>云分析</button>
            <button class="nav-item nav-sub-item" data-nav="team"><span class="nav-sub-dot"></span>成员与课题组</button>
          </div>
        </div>
        <button class="nav-item" data-nav="data"><span class="nav-icon" data-icon="chart"></span>项目数据</button>
      </nav>
      <div class="side-bottom"><div class="side-note-icon" data-icon="shield"></div><strong>让科研协作，井然有序</strong><p>连接课题组与项目，<br>共同探索数据的更多可能。</p><span class="side-note-badge"><i></i>科研协作空间</span></div>
      <div class="side-user"><span class="user-avatar">王</span><span><strong>王老师</strong><small>个人工作空间</small></span><span class="user-online" aria-label="在线"></span></div>
    </aside>

    <div class="workspace">
      <header class="topbar"><div class="crumb" id="crumb">工作空间 <span>/</span> 项目列表</div><div class="header-actions"><span class="demo-badge"><i></i>交互演示</span><span class="current-role-label" id="currentRoleLabel">项目管理者 · 王老师</span><div class="user-avatar header-avatar" aria-label="当前用户">王</div></div></header>
      <section class="role-preview-bar" aria-label="角色切换">
        <span class="role-preview-title">角色切换</span>
        <div class="role-preview-buttons" role="group" aria-label="选择体验角色">
          <button type="button" data-preview-role="owner" aria-pressed="true" class="active"><span data-icon="shield"></span>项目管理者</button>
          <button type="button" data-preview-role="support" aria-pressed="false"><span data-icon="person"></span>技术支持</button>
          <button type="button" data-preview-role="member" aria-pressed="false"><span data-icon="eye"></span>被分享用户</button>
        </div>
        <label class="recipient-account-control" id="recipientAccountControl" hidden><span>查看账号</span><select id="recipientSelect" aria-label="选择被分享用户"></select></label>
        <span class="role-preview-caption" id="rolePreviewCaption">可管理成员、角色和项目权限</span>
      </section>
      <main id="main"></main>
      <footer class="workspace-footer"><span>派森诺 · 科研协作空间</span><span>示例数据 · 交互操作保存在当前浏览器</span></footer>
    </div>
  </div>

  <div id="modalRoot" class="modal-root" hidden></div>
  <div id="confirmRoot" class="account-tip" role="status" aria-live="assertive" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js?v=20261029-roster-pending-six"></script>
</body>
</html>
